apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-commerce
spec:
  replicas: 3

  selector:
    matchLabels:
      app: quick-commerce

  template:
    metadata:
      labels:
        app: quick-commerce

    spec:
      containers:
        - name: quick-commerce
          image: quick-commerce:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10